<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到這個頁面｜鳳凰 AI 顧問</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="這個網址沒有對應頁面。請回到鳳凰 AI 顧問首頁，或改從聯絡頁留下需求。">
  <link rel="canonical" href="https://03king.com/404.html">
  <style>
    :root {
      --bg: #0B0B16;
      --card: #121226;
      --text: #F8F9FA;
      --muted: #A5B1B8;
      --accent: #E94560;
      --link: #00F2FE;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    .card { max-width: 560px; background: var(--card); border: 1px solid #1A1A3A; border-radius: 16px; padding: 40px 32px; }
    p.kicker { letter-spacing: 0.12em; color: var(--accent); font-size: 13px; margin: 0 0 12px; }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 16px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 16px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    a.btn { display: inline-block; text-decoration: none; padding: 12px 18px; border-radius: 999px; font-weight: 600; }
    a.primary { background: var(--accent); color: #fff; }
    a.secondary { border: 1px solid #5A6A75; color: var(--link); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="kicker">404</p>
      <h1>找不到這個頁面</h1>
      <p>這個網址沒有對應內容。請回到首頁，或改從聯絡頁告訴我們你的需求。</p>
      <div class="actions">
        <a class="btn primary" href="/">回到首頁</a>
        <a class="btn secondary" href="/contact.html">聯絡我們</a>
      </div>
    </section>
  </main>
</body>
</html>
